<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NES Game Database</title>
    <meta name="description" content="NES Game Database" />
    <meta name="keywords" content="nes, db, game, database" />
    <meta name="creator" content="justjavac" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="white" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="black" />
    <script>
      ;(function () {
        try {
          var theme = localStorage.getItem("theme") || "system"
          var isDark = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches)
          document.documentElement.classList.toggle("dark", isDark)
          document.documentElement.style.colorScheme = isDark ? "dark" : "light"
        } catch (e) {}
      })()
    </script>
  </head>
  <body class="flex flex-col h-screen min-h-screen bg-background antialiased">
    <div id="app" class="flex min-h-0 flex-1 flex-col"></div>
  </body>
</html>
